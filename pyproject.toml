[project]
name = "mcp-lab"
version = "0.1.0"
description = "Learn the Model Context Protocol by building a server, a client and an agent from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
